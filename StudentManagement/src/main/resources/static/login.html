<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management Login</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div class="page-shell">
    <div class="panel login-card">
        <p class="eyebrow">Student Management</p>
        <h1>Sign in to continue</h1>
        <p>Use your admin or student credentials. The app redirects you to the correct dashboard after a successful AJAX login.</p>
        <p class="pill">Default admin: admin@student.com / admin123</p>
        <div id="loginMessage" class="message"></div>
        <form id="loginForm">
            <label>Email
                <input type="email" id="email" placeholder="Enter email" required>
            </label>
            <label>Password
                <input type="password" id="password" placeholder="Enter password" required>
            </label>
            <button type="submit">Login</button>
        </form>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="/js/app.js"></script>
<script>
    $(function () {
        $("#loginForm").on("submit", function (event) {
            event.preventDefault();
            clearMessage("#loginMessage");

            $.ajax({
                url: "/api/auth/login",
                method: "POST",
                contentType: "application/json",
                data: JSON.stringify({
                    email: $("#email").val(),
                    password: $("#password").val()
                }),
                success: function (response) {
                    showMessage("#loginMessage", response.message, "success");
                    const role = response.data.role;
                    window.location.href = role === "ADMIN" ? "/admin-dashboard.html" : "/student-dashboard.html";
                },
                error: function (xhr) {
                    handleAjaxError(xhr, "#loginMessage");
                }
            });
        });
    });
</script>
</body>
</html>
